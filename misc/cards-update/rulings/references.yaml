# Rulings always have a reference, they come from somewhere.
# Each reference should be a valid URL, with a key indicating the source and date.
# The only valid sources are the successive Rules Director, the Ruling Team and the rulebook:
#
# - TOM: Thomas R Wylie, from 1994-12-15 onward
# - SFC: Shawn F. Carnes, from 1996-07-29 onward
# - JON: Jon Wilkie, from 1996-10-18 onward
# - LSJ: L. Scott Johnson, from 1998-06-22 onward
# - PIB: Pascal Bertrand, from 2011-07-06 onward
# - ANK: Vincent Ripoll aka. "Ankha", from 2016-12-04 onward
# - RTR: Rules Team Ruling
# - RBK: Rulebook
#
# The date must follow ISO order YYYYMMDD, with a facultative suffix after a dash `-` to avoid collisions
# The date is the date of the ruling. The post the URL points to is its best surviving witness, which is sometimes
# a later compilation or summary quoting it, and occasionally a neighbouring post when the original was never archived
#
# Rulings from the rec.games.trading-cards.jyhad newsgroup point to https://usenet.krcg.org/, a preserved copy of it,
# rather than to Google Groups: `/t/<ThreadId>/` is the thread, `#m0` the first message, `#m1` the second, and so on.
# Those anchors are positional, so the message order in the archive is part of the contract.
# The archive also holds threads copied from a forum: `/t/bgg-<ThreadId>/` for BoardGameGeek, `/t/vekn-<TopicId>/` for
# the VEKN forum. Those answer to the number their own forum gave each post as well, but are cited by position like
# every other thread here.
# A link with no anchor means the thread survives but the cited reply does not.
